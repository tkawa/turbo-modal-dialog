<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Modal Refresh</title>
  <meta name="turbo-refresh-method" content="morph">
  <link rel="stylesheet" href="/dist/style.css">
  <script type="module" src="/turbo.js"></script>
  <script type="module" src="/dist/turbo-modal-dialog.es2017-esm.js"></script>
</head>
<body>
  <header class="hide@native">
    <nav>
      <a href="/">Home</a>
    </nav>
  </header>

  <main>
    <h1 class="hide@native">Modal Refresh</h1>
    <p>This screen refreshes with morph.</p>
    <div id="permanent-note" data-turbo-permanent>initial</div>
  </main>

  <turbo-modal-dialog
    modal-fallback="/"
    content-stylesheet="/native.css">
    <script type="application/json">
      {
        "rules": [
          {
            "patterns": ["/modals/"],
            "properties": { "context": "modal" }
          },
          {
            "patterns": ["/forms/new$"],
            "properties": { "context": "modal", "modal_style": "form_sheet" }
          }
        ]
      }
    </script>
  </turbo-modal-dialog>
</body>
</html>
