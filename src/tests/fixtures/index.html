<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" href="/dist/style.css">
  <script type="module" src="/turbo.js"></script>
  <script type="module" src="/dist/turbo-modal-dialog.es2017-esm.js"></script>
</head>
<body>
  <header class="hide@native">
    <nav>
      <a href="/">Home</a>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <ul>
      <li><a href="/modals/first" id="open-modal">Open modal</a></li>
      <li><a href="/modals/slow" id="open-modal-slow">Open slow modal</a></li>
      <li><a href="/forms/new" id="open-form">Open form</a></li>
      <li><a href="/non-modal" id="go-non-modal">Go to non-modal page</a></li>
    </ul>
  </main>

  <turbo-modal-dialog
    modal-fallback="/"
    content-stylesheet="/native.css">
    <script type="application/json">
      {
        "rules": [
          {
            "patterns": ["/modals/"],
            "properties": { "context": "modal" }
          },
          {
            "patterns": ["/forms/new$"],
            "properties": { "context": "modal", "modal_style": "form_sheet" }
          }
        ]
      }
    </script>
  </turbo-modal-dialog>
</body>
</html>
